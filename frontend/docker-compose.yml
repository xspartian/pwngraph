# The graph store. Every `pwngraph scan` requires a reachable Neo4j — there
# is no in-process fallback (NetworkX/pyvis were removed). Bring this up
# before your first scan:
#
#   docker compose up -d
#   pwngraph doctor              # confirms connectivity
#   pwngraph scan --target ...   # uses bolt://localhost:7687 by default
#
# To run the backend contract suite against this instance:
#   NEO4J_TEST_URI=bolt://localhost:7687 NEO4J_TEST_PASSWORD=pwngraph-dev \
#     pytest tests/test_backend_contract.py -v
#
# Deliberately Neo4j-only — no Postgres. See the roadmap's non-goals: scan
# metadata fits in Neo4j, and "users/configuration" means multi-tenant auth,
# which is a different product this project isn't building yet.
#
# Production: change NEO4J_AUTH's password and point PWNGRAPH_NEO4J_PASSWORD
# at it — "pwngraph-dev" is a dev-only default, not a secret.
#
# This is the packaged copy `pwngraph docker-compose` writes out for anyone
# who only ran `pip install pwngraph` (pip installs don't drop project-root
# files like this on disk). Keep in sync with the repo-root docker-compose.yml.

services:
  neo4j:
    image: neo4j:5-community
    ports:
      - "7474:7474" # browser UI
      - "7687:7687" # bolt (what Neo4jBackend connects to)
    environment:
      NEO4J_AUTH: neo4j/pwngraph-dev
      NEO4J_PLUGINS: "[]"
    volumes:
      - pwngraph_neo4j_data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:7474 || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  pwngraph_neo4j_data:
