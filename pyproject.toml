[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pwngraph"
version = "0.1.0"
description = "Dynamic attack graph discovery for LangChain/LangGraph agent pipelines"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Suyog", email = "suyog.cybersec@gmail.com" },
]
keywords = [
    "ai-security",
    "agent-security",
    "langchain",
    "prompt-injection",
    "attack-graph",
    "fuzzing",
    "red-team",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Information Technology",
    "Topic :: Security",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "networkx>=3.0",
    "pyvis>=0.3.2",
    "pydantic>=2.0",
    "click>=8.1",
    "rich>=13.0",
    "jinja2>=3.1",
    "pyyaml>=6.0",
    "langchain>=0.1.0",
    "langchain-core>=0.1.0",
    "langchain-openai>=0.0.5",
    "langchain-community>=0.0.10",
    "langgraph>=0.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "pytest-asyncio>=0.21",
    "black>=23.0",
    "ruff>=0.1.0",
    "mypy>=1.5",
]
all = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "pytest-asyncio>=0.21",
    "black>=23.0",
    "ruff>=0.1.0",
    "mypy>=1.5",
]

[project.scripts]
pwngraph = "pwngraph.cli.main:cli"

[project.urls]
Homepage = "https://github.com/xspartian/pwngraph"
Documentation = "https://github.com/xspartian/pwngraph/blob/main/docs/"
Repository = "https://github.com/xspartian/pwngraph"
Issues = "https://github.com/xspartian/pwngraph/issues"

[tool.setuptools.packages.find]
include = ["pwngraph*"]
exclude = ["tests*", "examples*"]

[tool.setuptools.package-data]
pwngraph = ["reporter/templates/*.j2", "profiles/*.yaml", "py.typed"]

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q --strict-markers"
testpaths = ["tests"]
markers = [
    "integration: marks tests as integration (deselect with '-m \"not integration\"')",
    "slow: marks tests as slow",
]

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
strict = false
ignore_missing_imports = true
